    - paragraph [ref=f5e5]: Что такое 3D-сканер
    - heading "Устройство, которое «читает» форму предмета" [level=2] [ref=f5e6]
    - paragraph [ref=f5e7]: 3D-сканер измеряет тысячи точек на поверхности объекта и определяет их координаты в пространстве (X, Y, Z). Компьютер собирает эти точки в объёмную модель — точную цифровую копию предмета.
    - paragraph [ref=f5e9]: Копирует форму. Точная 3D-копия любого предмета.
    - paragraph [ref=f5e11]: Ускоряет работу. Заменяет долгие ручные замеры.
    - paragraph [ref=f5e13]: Готово к печати. Модель сразу можно печатать на 3D-принтере.
