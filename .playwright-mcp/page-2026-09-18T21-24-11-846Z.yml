    - paragraph [ref=f15e5]: Что такое 3D-сканер
    - heading "Устройство, которое «читает» форму предмета" [level=2] [ref=f15e6]
    - paragraph [ref=f15e7]: 3D-сканер измеряет тысячи точек на поверхности объекта и определяет их координаты в пространстве (X, Y, Z). Компьютер собирает эти точки в объёмную модель — точную цифровую копию предмета.
    - paragraph [ref=f15e9]: Копирует форму. Точная 3D-копия любого предмета.
    - paragraph [ref=f15e11]: Ускоряет работу. Заменяет долгие ручные замеры.
    - paragraph [ref=f15e13]: Готово к печати. Модель сразу можно печатать на 3D-принтере.
    - paragraph [ref=f15e16]: ЗА СЕКУНДУ
    - paragraph [ref=f15e17]: 1 000 000+
    - paragraph [ref=f15e18]: точек снимает сканер всего за одну секунду работы
